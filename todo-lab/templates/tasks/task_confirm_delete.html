{% extends 'tasks/base.html' %}

{% block content %}

<h2>Delete Task</h2>

<p>
    Are you sure you want to delete this task?
</p>

<h3>{{ task.title }}</h3>

<form method="POST">

    {% csrf_token %}

    <button type="submit">Delete Task</button>

    <a href="{% url 'task_detail' task.pk %}">Cancel</a>

</form>

{% endblock %}
