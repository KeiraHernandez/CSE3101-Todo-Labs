
{% extends 'tasks/base.html' %}

{% block content %}

<h2>All Tasks</h2>

<a href="{% url 'task_create' %}">Add New Task</a>

{% if tasks %}

    {% for task in tasks %}

        <h3>
            <a href="{% url 'task_detail' task.pk %}">
                {{ task.title }}
            </a>
        </h3>

        <p>
            Status:
            {% if task.completed %}
                Completed
            {% else %}
                Pending
            {% endif %}
        </p>

        <hr>

    {% endfor %}

{% else %}

    <p>No tasks have been added yet.</p>

{% endif %}

{% endblock %}
